<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نواة AI — إعادة التوجيه</title>
  <script>
    (function () {
      var base = '/nawa-ai-academy/';
      var current = window.location.pathname;
      var rest = current.indexOf(base) === 0 ? current.slice(base.length) : '';
      window.location.replace(base + (rest ? '?path=' + encodeURIComponent(rest) : '') + window.location.hash);
    }());
  </script>
</head>
<body><p>جاري فتح موقع نواة AI...</p></body>
</html>
